<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; font-src 'self'; connect-src 'none'; frame-src 'none';">
  <title>SyntaxSnap</title>
  <style>
    @font-face { font-family: "IBM Plex Sans"; src: url("fonts/plex-sans-var.woff2") format("woff2-variations"); font-weight: 100 700; }
    @font-face { font-family: "IBM Plex Mono"; src: url("fonts/plex-mono-400.woff2") format("woff2"); font-weight: 400; }
    :root {
      --bg: #0c121d; --rail: #0f1623; --panel: #141c2b; --raised: #1a2335; --line: #212b3f;
      --text: #d3dbe7; --muted: #8d9ab0; --faint: #66758e; --accent: #27b4f2; --local: #45d48a;
    }
    * { box-sizing: border-box; }
    body { width: 340px; margin: 0; background: var(--bg); color: var(--text); font: 13px/1.45 "IBM Plex Sans", system-ui, sans-serif; }
    a { color: inherit; text-decoration: none; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; border-radius: 4px; }
    header { display: flex; align-items: center; gap: 9px; padding: 14px 14px 10px; }
    header img { width: 22px; height: 22px; }
    .brand { font-size: 15px; font-weight: 600; color: #fff; letter-spacing: -0.01em; }
    .brand span { color: var(--accent); }
    .search { padding: 0 14px 10px; }
    .search input { width: 100%; height: 34px; padding: 0 10px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; outline: none; }
    .search input:focus { border-color: var(--accent); }
    h2 { margin: 6px 14px 4px; font-size: 11.5px; font-weight: 500; color: var(--faint); }
    ul { list-style: none; margin: 0; padding: 0 6px; max-height: 300px; overflow-y: auto; }
    li a { display: block; padding: 6px 8px; border-radius: 5px; }
    li a:hover, li a:focus-visible { background: var(--raised); }
    .name { display: block; color: var(--text); font-weight: 500; }
    .desc { display: block; color: var(--muted); font-size: 12px; }
    .empty { padding: 10px 14px; color: var(--muted); }
    .tip { margin: 10px 14px 0; padding: 9px 10px; border-radius: 6px; background: var(--panel); border: 1px solid var(--line); color: var(--muted); font-size: 12px; }
    .tip b { color: var(--text); font-weight: 500; }
    .svg { margin: 10px 14px 0; }
    .btn { width: 100%; height: 32px; border-radius: 6px; border: 1px solid var(--line); background: var(--panel); color: var(--text); font: inherit; font-weight: 500; cursor: pointer; }
    .btn:hover { border-color: #2e3a52; background: var(--raised); }
    .svg-results { margin-top: 8px; max-height: 220px; overflow-y: auto; }
    .svg-row { display: flex; align-items: center; justify-content: space-between; gap: 8px; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; margin-bottom: 6px; background: var(--panel); }
    .svg-row img { width: 22px; height: 22px; object-fit: contain; background: var(--raised); border-radius: 4px; padding: 3px; }
    .svg-row .meta { display: flex; align-items: center; gap: 8px; min-width: 0; font: 11.5px "IBM Plex Mono", monospace; color: var(--muted); }
    .svg-row button { height: 24px; padding: 0 8px; border: 0; border-radius: 4px; background: var(--accent); color: #0c121d; font: inherit; font-size: 11.5px; font-weight: 600; cursor: pointer; }
    .status { font-size: 12px; color: var(--muted); }
    .status.error { color: #fda4af; }
    footer { display: flex; align-items: center; justify-content: space-between; margin-top: 12px; padding: 9px 14px; border-top: 1px solid var(--line); background: var(--rail); font: 11.5px "IBM Plex Mono", monospace; color: var(--faint); }
    footer .local::before { content: ""; display: inline-block; width: 6px; height: 6px; border-radius: 50%; background: var(--local); margin-right: 6px; vertical-align: 1px; }
    footer a { color: var(--accent); }
  </style>
</head>
<body>
  <header>
    <img src="icon.svg" alt="">
    <div class="brand">Syntax<span>Snap</span></div>
  </header>

  <div class="search">
    <label for="search-input" style="position:absolute;left:-9999px">Search tools</label>
    <input type="text" id="search-input" placeholder="Search tools, like json or zod" autocomplete="off" spellcheck="false">
  </div>

  <h2 id="list-heading">Popular</h2>
  <ul id="tool-list" aria-labelledby="list-heading"></ul>
  <p id="empty" class="empty" hidden>No tool matches that. Try "json", "zod" or "sql".</p>

  <p class="tip"><b>Tip:</b> select JSON, a JWT or a schema on any page, right-click and choose <b>SyntaxSnap</b> to open it in the right tool.</p>

  <div class="svg">
    <button id="extract-svg-btn" class="btn" type="button">Extract SVGs from this page</button>
    <div id="svg-results" class="svg-results" aria-live="polite"></div>
  </div>

  <footer>
    <span class="local">Runs in your browser</span>
    <a id="all-tools" href="https://syntaxsnap.com/tools?utm_source=extension&amp;utm_medium=popup" target="_blank" rel="noopener noreferrer">All tools</a>
  </footer>

  <script src="tools.js"></script>
  <script src="popup.js"></script>
</body>
</html>
